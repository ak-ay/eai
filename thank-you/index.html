<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Request Received | Empowering Aspirational India</title>
    <link rel="icon" href="../assets/logo.jpeg" />
    <style>
      :root {
        --ink: #111827;
        --muted: #5f6b7a;
        --navy: #0a2540;
        --orange: #ec7f16;
        --line: #dfe6ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: var(--ink);
        background:
          linear-gradient(90deg, rgba(7, 22, 41, 0.94), rgba(7, 22, 41, 0.76)),
          url("../assets/hero.jpeg") center / cover no-repeat;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(680px, calc(100% - 32px));
        padding: 34px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        color: #fff;
        background: rgba(4, 16, 34, 0.74);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px);
      }

      img {
        width: 64px;
        height: 64px;
        object-fit: cover;
        border-radius: 6px;
        background: #fff;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2.4rem, 7vw, 4.8rem);
        line-height: 0.98;
      }

      p {
        margin: 0 0 24px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 8px;
        color: #fff;
        background: var(--orange);
        font-weight: 850;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../assets/logo.jpeg" width="64" height="64" alt="Empowering Aspirational India logo" />
      <h1>Request Received.</h1>
      <p>Thank you for contacting Empowering Aspirational India. The team will review your course guidance request and get back to you shortly.</p>
      <a href="../">Back to Home</a>
    </main>
  </body>
</html>
